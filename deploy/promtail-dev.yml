# 开发：通过 Docker API 发现容器，把 json-file 中的 log 行送到 Loki。
# worker/dispatcher 使用 sink=docker_json 时，每行一条 JSON，可在 Grafana 中用 LogQL：| json | run_id="..."
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
