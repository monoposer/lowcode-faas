services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: faas
      POSTGRES_PASSWORD: faas
      POSTGRES_DB: lowcode
    ports:
      - "5433:5432"
    volumes:
      - faas-pg:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faas -d lowcode"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_REGION: us-east-1
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs-data:/data
    depends_on:
      rustfs-volume-permission:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  rustfs-volume-permission:
    image: alpine:3.20
    volumes:
      - rustfs-data:/data
    command:
      - sh
      - -c
      - chown -R 10001:10001 /data && echo 'rustfs volume permissions fixed'
    restart: "no"

  # Meta control plane (CRUD + compile). Worker is not shipped here — embed lowcode-faas/worker in your app.
  # Profile so default `docker compose up` still only starts infra (postgres + rustfs).
  meta:
    profiles: ["meta"]
    build: .
    ports:
      - "8080:8080"
    environment:
      LOWCODE_FAAS_LISTEN: ":8080"
      LOWCODE_FAAS_POSTGRES_DSN: postgres://faas:faas@postgres:5432/lowcode?sslmode=disable&search_path=faas
      LOWCODE_FAAS_S3_ENDPOINT: http://rustfs:9000
      LOWCODE_FAAS_S3_REGION: us-east-1
      LOWCODE_FAAS_S3_BUCKET: lowcode-faas
      LOWCODE_FAAS_S3_ACCESS_KEY: rustfsadmin
      LOWCODE_FAAS_S3_SECRET_KEY: rustfsadmin
      LOWCODE_FAAS_S3_USE_PATH_STYLE: "true"
      LOWCODE_FAAS_S3_PUBLIC_BASE: http://127.0.0.1:9000/lowcode-faas
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  faas-pg:
  rustfs-data:
